services:
  - type: web
    name: edgar-substack-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn telegram_bot:app
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUBSTACK_EMAIL
        sync: false
      - key: SUBSTACK_PASSWORD
        sync: false
      - key: SUBSTACK_PUBLICATION_URL
        sync: false
